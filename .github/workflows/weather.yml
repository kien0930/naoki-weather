name: Cập nhật thời tiết

on:
  schedule:
    - cron: "7,37 * * * *"   # mỗi 30 phút
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lấy thời tiết từ Open-Meteo
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "https://api.open-meteo.com/v1/forecast?latitude=10.82,10.03,21.03,20.86,16.46,16.05,12.24,11.94&longitude=106.63,105.78,105.85,106.68,107.59,108.20,109.19,108.44&current=temperature_2m,relative_humidity_2m,weather_code,is_day&timezone=Asia%2FBangkok" \
            -o raw.json
          python3 build.py raw.json
          rm raw.json

      - name: Lưu vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.js weather.json
          git diff --cached --quiet || git commit -m "Cập nhật thời tiết $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Làm mới cache jsDelivr
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/weather.js" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/weather.json" || true
